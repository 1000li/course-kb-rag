<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>讲义知识库 · RAG 问答</title>
<style>
  /* ============================================================
     讲义知识库 · RAG 问答 — 瑞士国际主义风格
     白底点阵 · 克莱因蓝 #002FA7 · 柠檬黄 #FFDD00 · 安全橙 #FF4D00（仅拒答）
     硬边框 · 编号标签 · 无圆角 / 无阴影 / 无渐变
     首访 onboarding：欢迎 + 示例 + 输入整体居中；提问后输入区滑到底部固定
     ============================================================ */
  :root{
    --ikb:#002FA7;
    --ikb-2:#001f70;
    --lemon:#FFDD00;
    --orange:#FF4D00;
    --ink:#101010;
    --paper:#ffffff;
    --dot:#e6e6e6;
    --hair:#d9d9d9;
    --muted:#6a6a6a;
    --composer-w:800px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background-color:var(--paper);
    background-image:radial-gradient(var(--dot) 1px, transparent 1.3px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.6;
  }
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--lemon);color:var(--ink);}

  .app{display:flex;flex-direction:column;height:100dvh;max-width:100%;}

  /* ---------- 顶部栏 ---------- */
  .topbar{
    flex:none;
    display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
    width:100%;max-width:var(--composer-w);margin:0 auto;
    padding:22px 20px 14px;
    border-bottom:3px solid var(--ink);
    background:rgba(255,255,255,.92);
  }
  .overline{
    font-size:9.5px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;
    color:var(--ikb);margin-bottom:5px;white-space:nowrap;
  }
  h1{font-size:26px;font-weight:900;line-height:1.15;letter-spacing:.01em;color:var(--ikb);}
  h1 .hl{color:var(--ink);background:var(--lemon);padding:0 5px;}
  .top-ctrl{display:flex;align-items:center;gap:10px;flex:none;}

  .seg{display:flex;border:2px solid var(--ink);background:var(--paper);}
  .seg-btn{
    background:var(--paper);border:none;color:var(--ink);
    font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 16px;
  }
  .seg-btn+.seg-btn{border-left:2px solid var(--ink);}
  .seg-btn.active{background:var(--ikb);color:#fff;}
  .seg-btn:not(.active):hover{background:var(--lemon);}

  .info-btn{
    background:var(--paper);border:2px solid var(--ink);color:var(--ikb);
    font-size:12px;font-weight:800;letter-spacing:.05em;
    padding:8px 12px;white-space:nowrap;
  }
  .info-btn:hover{background:var(--lemon);}

  /* 版本差异说明卡：默认收起 */
  .info-card{
    display:none;
    width:100%;max-width:var(--composer-w);margin:0 auto;
    padding:14px 18px;border-bottom:2px solid var(--ink);
    background:var(--lemon);
    font-size:13px;
  }
  .info-card.open{display:block;}
  .info-card h2{
    font-size:12px;font-weight:900;letter-spacing:.26em;text-transform:uppercase;
    margin-bottom:8px;
  }
  .info-card ul{list-style:none;}
  .info-card li{position:relative;padding-left:18px;margin:5px 0;}
  .info-card li::before{content:"—";position:absolute;left:0;color:var(--ikb);font-weight:800;}
  .info-card .note{margin-top:10px;padding-top:8px;border-top:1.5px solid var(--ink);font-size:12px;}
  .info-card .ic-close{
    float:right;border:1.5px solid var(--ink);background:var(--paper);
    font-size:11px;font-weight:800;padding:2px 8px;
  }
  .info-card .ic-close:hover{background:var(--ikb);color:#fff;}

  /* ---------- 首访 onboarding：整组（欢迎+示例+输入）垂直居中 ---------- */
  .onboard{
    flex:1 1 auto;display:flex;overflow-y:auto;
  }
  .onboard-inner{
    margin:auto;width:100%;max-width:var(--composer-w);
    padding:28px 20px 34px;
  }
  .welcome{text-align:center;}

  /* ---------- 消息区：滚动容器 ---------- */
  .chat{
    flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
    width:100%;max-width:var(--composer-w);margin:0 auto;
    padding:18px 20px 10px;
    display:flex;flex-direction:column;gap:16px;
  }
  .chat[hidden]{display:none;}
  .msg{width:100%;}

  .msg-q{display:flex;justify-content:flex-end;}
  .bubble-q{
    max-width:78%;text-align:left;
    background:var(--ikb);color:#fff;border:2px solid var(--ikb);
    padding:10px 14px;font-size:14.5px;white-space:pre-wrap;word-break:break-word;
  }
  .msg-q .qver{
    display:block;text-align:right;font-size:10px;letter-spacing:.14em;
    color:#cfe0ff;margin-top:5px;font-weight:700;
  }

  .msg-a{border:2px solid var(--ink);background:var(--paper);}
  .msg-a .msg-head{
    display:flex;align-items:center;gap:9px;
    padding:6px 12px;border-bottom:2px solid var(--ink);
    font-size:10.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  }
  .msg-a .tag{padding:2px 8px;}
  .badge-a{background:var(--lemon);color:var(--ink);}
  .badge-o{background:var(--orange);color:#fff;}
  .msg-a .vtag{margin-left:auto;color:var(--muted);font-weight:700;letter-spacing:.1em;}
  .msg-body{padding:13px 16px;white-space:pre-wrap;font-size:15px;word-break:break-word;}

  .msg-a.abstain{border-color:var(--orange);}
  .msg-a.abstain .msg-head{border-bottom-color:var(--orange);}
  .abstain-banner{border:2px solid var(--orange);margin:13px 14px 0;padding:11px 13px;}
  .abstain-title{color:var(--orange);font-size:17px;font-weight:900;letter-spacing:.08em;}
  .abstain-note{font-size:12px;color:#555;margin-top:5px;letter-spacing:.03em;}
  .abstain-answer{margin:12px 14px;font-size:15px;}

  .cites{margin:0 14px 12px;}
  .cites-label{
    font-size:10px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;
    color:var(--ikb);margin-bottom:7px;
  }
  .cites-list{display:flex;flex-wrap:wrap;gap:7px;}
  .cite{
    background:var(--lemon);border:1.5px solid var(--ink);
    padding:5px 9px;font-size:12px;font-weight:800;line-height:1.4;
  }
  .cite .page{color:#444;font-weight:700;}

  .meta{
    font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
    font-size:10.5px;letter-spacing:.04em;color:var(--muted);
    padding:7px 14px;border-top:1px solid var(--hair);
  }

  .msg-a.loading .msg-head{border-bottom-color:var(--ikb);}
  .steps{padding:13px 16px;display:flex;flex-direction:column;gap:9px;}
  .step{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;}
  .step .snum{color:var(--ikb);font-size:10.5px;font-weight:800;letter-spacing:.18em;}
  .step .dots{display:inline-flex;gap:4px;}
  .step .dot{width:6px;height:6px;background:var(--ikb);opacity:.15;animation:blink 1.1s infinite;}
  .step.active{color:var(--ikb);}
  .step.active .dot{opacity:1;}
  .step.done{color:#333;}
  .step.done .snum{color:#333;}
  @keyframes blink{0%,100%{opacity:.15;}50%{opacity:1;}}

  /* ---------- 示例卡片 ---------- */
  .welcome h2{font-size:22px;font-weight:900;letter-spacing:.04em;color:var(--ikb);}
  .welcome .sub{font-size:12.5px;color:var(--muted);margin-top:8px;letter-spacing:.05em;}
  .example-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
    margin-top:26px;text-align:left;align-items:stretch;
  }
  .egroup{
    border:2px solid var(--ink);background:var(--paper);
    padding:13px 14px;display:flex;flex-direction:column;
  }
  .egroup h3{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin-bottom:9px;}
  .egroup.g-hit h3{color:var(--ikb);}
  .egroup.g-abstain h3{color:var(--orange);}
  .egroup.g-compare h3{color:var(--ikb);}
  .ecard{
    display:block;width:100%;text-align:left;
    border:1.5px solid var(--ink);background:var(--paper);
    font-size:12.5px;font-weight:700;color:var(--ink);
    padding:8px 10px;margin-top:7px;
  }
  .ecard:hover{background:var(--lemon);}
  .ecard .note{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px;letter-spacing:.03em;}

  /* 双卡网格内的条目：固定等高、纵向居中 —— 行对齐统一，条目少的一卡留白补齐，不拉伸条目 */
  .example-grid .ecard{
    height:42px;display:flex;align-items:center;justify-content:flex-start;
    overflow:hidden;
  }

  /* 「更多示例 ▾」低调入口 + 展开的版本对比卡 */
  .more-toggle{
    display:block;margin:14px auto 0;
    border:1.5px solid var(--ink);background:var(--paper);
    color:var(--ikb);font-size:11.5px;font-weight:800;letter-spacing:.14em;
    padding:6px 13px;text-transform:uppercase;
  }
  .more-toggle:hover{background:var(--lemon);}
  .more-toggle.open{background:var(--ikb);color:#fff;}
  .more-panel{display:none;margin-top:12px;text-align:left;}
  .more-panel.open{display:block;}
  .welcome .more-panel .egroup{max-width:340px;margin:0 auto;}
  .expanel .more-panel .egroup{max-width:340px;}

  /* 输入区上方的「示例」面板（问过问题后） */
  .app.onboarding .exwrap{display:none;}
  .exwrap{flex:none;width:100%;max-width:var(--composer-w);margin:0 auto;}
  .expanel{
    display:none;border:2px solid var(--ink);background:var(--paper);
    margin:0 20px 9px;padding:13px 14px;max-height:60vh;overflow-y:auto;
  }
  .expanel.open{display:block;}
  .expanel .example-grid{grid-template-columns:1fr 1fr;margin-top:0;gap:10px;}
  .expanel .egroup{padding:10px 11px;}
  .expanel .ecard{font-size:12px;padding:7px 9px;}
  .expanel .more-toggle{margin-left:0;}

  /* ---------- 底部固定输入区 ---------- */
  .composer{
    flex:none;width:100%;max-width:var(--composer-w);margin:0 auto;
    padding:0 20px 14px;
  }
  .app.onboarding .composer{padding:0;}  /* onboarding 内：宽度/内边距与底部一致 */
  .composer-row{display:flex;align-items:flex-end;gap:0;border:2px solid var(--ink);background:var(--paper);}
  .q-input{
    flex:1 1 auto;border:none;background:transparent;resize:none;overflow-y:auto;
    min-height:48px;max-height:140px;line-height:1.5;
    padding:13px 14px 11px;font-family:inherit;font-size:15px;color:var(--ink);
  }
  .q-input::placeholder{color:#9a9a9a;}
  .q-input:focus{outline:none;box-shadow:inset 3px 0 0 0 var(--ikb);}
  .send-btn{
    flex:none;border:none;background:var(--ikb);color:#fff;
    font-size:13px;font-weight:900;letter-spacing:.18em;
    padding:14px 20px;align-self:stretch;text-transform:uppercase;
  }
  .send-btn:hover{background:var(--ikb-2);}
  .send-btn:disabled{background:#8fa3d9;cursor:not-allowed;}
  .composer-note{
    margin-top:7px;font-size:10.5px;letter-spacing:.14em;
    color:var(--muted);text-transform:uppercase;font-weight:700;
  }
  .composer-note .ex-toggle{
    float:right;border:1.5px solid var(--ink);background:var(--paper);
    color:var(--ikb);font-size:10.5px;font-weight:800;letter-spacing:.12em;
    padding:3px 10px;text-transform:uppercase;
  }
  .composer-note .ex-toggle:hover{background:var(--ikb);color:#fff;}
  .composer-note .ex-toggle.dim{opacity:.45;}
  .app.onboarding .ex-toggle{display:none;}  /* 首访时示例已在欢迎区，不显示该按钮 */

  /* ---------- 移动端（<560px）：移动优先缩放 ---------- */
  @media (max-width:560px){
    .topbar{padding:16px 14px 12px;gap:10px;flex-wrap:wrap;}
    .overline{font-size:8.5px;letter-spacing:.26em;}
    h1{font-size:20px;}
    .top-ctrl{gap:7px;}
    .seg-btn{padding:7px 12px;font-size:11.5px;}
    .info-btn{padding:7px 9px;font-size:11px;}
    .info-card{padding:12px 13px;font-size:12.5px;}
    .onboard-inner{padding:18px 12px 24px;}
    .chat{padding:14px 12px 8px;gap:13px;}
    .bubble-q{max-width:92%;font-size:14px;padding:9px 12px;}
    .msg-body{padding:11px 12px;font-size:14px;}
    .msg-a .msg-head{padding:5px 10px;font-size:10px;}
    .cite{font-size:11px;padding:4px 8px;}
    .meta{font-size:10px;padding:6px 12px;}
    .welcome h2{font-size:17px;}
    .welcome .sub{font-size:11px;}
    .example-grid{grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px;}
    .egroup{padding:9px;}
    .egroup h3{font-size:9.5px;letter-spacing:.1em;margin-bottom:6px;}
    .ecard{font-size:11px;padding:6px 7px;}
    .example-grid .ecard{height:50px;line-height:1.45;}
    .expanel .ecard{font-size:11px;}
    .more-toggle{font-size:10.5px;margin-top:10px;padding:5px 11px;}
    .expanel{margin:0 12px 9px;padding:11px 12px;}
    .composer{padding:0 12px 10px;}
    .app.onboarding .composer{padding:0;}
    .q-input{min-height:44px;max-height:120px;padding:11px 12px 9px;font-size:15px;}
    .send-btn{padding:12px 16px;font-size:12px;letter-spacing:.12em;}
  }
</style>
</head>
<body>
<div class="app onboarding" id="app">

  <!-- 顶部栏：品牌 + 版本切换 + 版本差异入口 -->
  <header class="topbar">
    <div class="brand">
      <div class="overline">M8 · RAG Q&amp;A — 讲义知识库</div>
      <h1>讲义知识库 <span class="hl">· RAG 问答</span></h1>
    </div>
    <div class="top-ctrl">
      <div class="seg" id="seg" role="group" aria-label="讲义版本">
        <button class="seg-btn active" data-v="v1.2">v1.2</button>
        <button class="seg-btn" data-v="v1.0">v1.0</button>
      </div>
      <button class="info-btn" id="infoBtn" aria-expanded="false">ⓘ 版本差异？</button>
    </div>
  </header>

  <!-- 版本差异说明卡：默认收起 -->
  <aside class="info-card" id="infoCard" aria-hidden="true">
    <button class="ic-close" id="infoClose" type="button">收起</button>
    <h2>版本差异</h2>
    <ul>
      <li><b>v1.2（当前）</b>：15 课完整修订版，课序正确。</li>
      <li><b>v1.0（历史版）</b>：仅 14 课，缺「第15课 AI 与未来」，课序有错位。</li>
    </ul>
    <div class="note">用途：切换上方版本，对同一问题各问一次，对比两版回答差异，体会「内容版本管理」。</div>
  </aside>

  <!-- 首访 onboarding：欢迎语 + 示例卡 + 输入区（整组居中） -->
  <div class="onboard" id="onboard">
    <div class="onboard-inner">
      <div class="welcome" id="welcome">
        <h2>可以问我关于这本讲义的任何问题</h2>
        <div class="sub">命中讲义的回答会附出处标签与检索信号（可溯源）；超纲问题将被拒答，不调用 LLM。</div>
        <!-- 示例卡 + 「更多示例」由 JS 注入 -->
      </div>
      <div class="composer" id="composer">
        <div class="composer-row">
          <textarea id="q" class="q-input" rows="1"
                    placeholder="输入问题，Enter 发送 · Shift+Enter 换行"></textarea>
          <button id="ask" class="send-btn" disabled>发送</button>
        </div>
        <div class="composer-note">
          Enter 发送 · Shift+Enter 换行
          <button class="ex-toggle" id="exToggle" type="button">示例</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 消息区：滚动容器 -->
  <main class="chat" id="chat" hidden></main>

  <!-- 输入区上方的可展开示例面板 -->
  <div class="exwrap" id="exwrap">
    <div class="expanel" id="expanel"></div>
  </div>

</div>

<script>
(() => {
  const app = document.getElementById('app');
  const chat = document.getElementById('chat');
  const seg = document.getElementById('seg');
  const input = document.getElementById('q');
  const askBtn = document.getElementById('ask');
  const infoBtn = document.getElementById('infoBtn');
  const infoClose = document.getElementById('infoClose');
  const infoCard = document.getElementById('infoCard');
  const onboard = document.getElementById('onboard');
  const welcome = document.getElementById('welcome');
  const composer = document.getElementById('composer');
  const expanel = document.getElementById('expanel');
  const exToggle = document.getElementById('exToggle');

  const state = { version: 'v1.2', busy: false, asked: false, exOpen: false };

  /* ================= 示例问题 ================= */
  const EXAMPLES = [
    { group: '可以问这些', cls: 'g-hit', items: [
      '机器学习有哪几种类型？',
      'Transformer 的注意力机制是什么？',
      'RGB 和 HSV 有什么区别？',
    ]},
    { group: '这些会被拒答（超纲演示）', cls: 'g-abstain', items: [
      '量子计算的基本原理是什么？',
      '红烧肉怎么做？',
    ]},
    { group: '版本对比试试', cls: 'g-compare', note: '切换上方版本再问一次，对比答案', items: [
      '讲义中认为 AI 未来有哪些发展趋势？',
    ]},
  ];

  function egroup(g) {
    const eg = document.createElement('div');
    eg.className = 'egroup ' + g.cls;
    const h3 = document.createElement('h3');
    h3.textContent = g.group;
    eg.appendChild(h3);
    g.items.forEach(q => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ecard';
      b.dataset.q = q;
      b.textContent = q;
      if (g.note) {
        const n = document.createElement('span');
        n.className = 'note';
        n.textContent = g.note;
        b.appendChild(n);
      }
      eg.appendChild(b);
    });
    return eg;
  }

  /* 示例结构：两张等高卡片（可问 / 拒答）+ 「更多示例」展开版本对比 */
  function buildCards(parent) {
    const grid = document.createElement('div');
    grid.className = 'example-grid';
    EXAMPLES.filter(g => g.group !== '版本对比试试').forEach(g => grid.appendChild(egroup(g)));
    parent.appendChild(grid);

    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'more-toggle';
    more.dataset.label = '更多示例 ▾';
    more.dataset.openLabel = '收起示例 ▴';
    more.textContent = more.dataset.label;
    parent.appendChild(more);

    const panel = document.createElement('div');
    panel.className = 'more-panel';
    panel.appendChild(egroup(EXAMPLES.find(g => g.group === '版本对比试试')));
    parent.appendChild(panel);
  }

  function buildExpanel() {
    expanel.innerHTML = '';
    buildCards(expanel);
    expanel.classList.remove('open');
    state.exOpen = false;
    exToggle.classList.remove('dim');
    exToggle.textContent = '示例';
  }

  /* ================= 工具 ================= */
  function scrollBottom() {
    requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
  }
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function head(inner, version) {
    const h = el('div', 'msg-head');
    h.appendChild(inner);
    if (version) h.appendChild(el('span', 'vtag', version));
    return h;
  }
  function tagSpan(label, cls) {
    return el('span', 'tag ' + cls, label);
  }

  /* ================= 消息渲染 ================= */
  function pushQ(text, version) {
    const wrap = el('div', 'msg msg-q');
    const b = el('div', 'bubble-q', text);
    const v = el('span', 'qver', '→ ' + version);
    b.appendChild(v);
    wrap.appendChild(b);
    chat.appendChild(wrap);
    scrollBottom();
  }

  function pushA(d, version) {
    const m = el('div', 'msg msg-a' + (d.abstained ? ' abstain' : ''));
    const label = d.abstained ? 'A · 拒答' : 'A · 回答';
    const tagCls = d.abstained ? 'badge-o' : 'badge-a';
    m.appendChild(head(tagSpan(label, tagCls), version));

    const body = el('div', 'msg-body');
    if (d.abstained) {
      const banner = el('div', 'abstain-banner');
      banner.appendChild(el('div', 'abstain-title', '超出讲义范围'));
      banner.appendChild(el('div', 'abstain-note',
        '双信号拒答判定低于阈值，未调用 LLM —— 本结论仅由检索信号强度决定（见下方 maxVec / maxBM25）。'));
      body.appendChild(banner);
      body.appendChild(el('div', 'abstain-answer', d.answer));
    } else {
      body.textContent = d.answer;
    }
    m.appendChild(body);

    if (!d.abstained && Array.isArray(d.citations) && d.citations.length) {
      const cites = el('div', 'cites');
      cites.appendChild(el('div', 'cites-label', '03 / 出处'));
      const list = el('div', 'cites-list');
      d.citations.forEach(c => {
        const t = el('span', 'cite');
        t.title = 'chunk: ' + c.chunk_id;
        t.appendChild(document.createTextNode('第' + c.lesson_no + '课'));
        if (c.section_title) {
          t.appendChild(document.createTextNode(' · ' + c.section_title));
        }
        t.appendChild(document.createTextNode(' · '));
        t.appendChild(el('span', 'page', 'P' + c.page_range));
        list.appendChild(t);
      });
      cites.appendChild(list);
      m.appendChild(cites);
    }

    const r = d.retrieval || {};
    m.appendChild(el('div', 'meta',
      'maxVec ' + (r.max_vec ?? '-') +
      ' · maxBM25 ' + (r.max_bm25 ?? '-') +
      ' · ' + (d.latency_ms ?? '-') + ' ms' +
      ' · scope ' + version));
    chat.appendChild(m);
    scrollBottom();
  }

  function pushLoading() {
    const m = el('div', 'msg msg-a loading');
    m.appendChild(head(tagSpan('A · 处理中', 'badge-a'), state.version));
    const wrap = el('div', 'steps');
    const mkStep = (num, text) => {
      const s = el('div', 'step');
      s.appendChild(el('span', 'snum', num + ' /'));
      s.appendChild(el('span', null, text));
      const dots = el('span', 'dots');
      dots.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
      s.appendChild(dots);
      return s;
    };
    const s1 = mkStep('01', '混合检索 + 双信号拒答判定');
    const s2 = mkStep('02', 'LLM 生成回答');
    wrap.appendChild(s1);
    wrap.appendChild(s2);
    m.appendChild(wrap);
    chat.appendChild(m);
    scrollBottom();

    const to1 = setTimeout(() => {
      s1.classList.remove('active'); s1.classList.add('done');
      s2.classList.add('active');
    }, 1200);
    return { node: m, timers: [to1] };
  }

  function pushError(text) {
    const m = el('div', 'msg msg-a');
    m.appendChild(head(tagSpan('! 错误', 'badge-o'), ''));
    m.appendChild(el('div', 'msg-body', text));
    chat.appendChild(m);
    scrollBottom();
  }

  /* ================= 首访 → chatbot 布局切换（输入区居中→底部，FLIP 过渡） ================= */
  function enterChatLayout() {
    const r0 = composer.getBoundingClientRect();
    app.classList.remove('onboarding');
    app.append(exwrap, composer);   // 输入区移入底部固定位
    onboard.remove();               // 移除居中 onboarding（含欢迎/示例卡）
    chat.hidden = false;            // 显示消息区
    const r1 = composer.getBoundingClientRect();
    const dx = r0.left - r1.left, dy = r0.top - r1.top;
    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
      composer.style.transition = 'none';
      composer.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      requestAnimationFrame(() => {
        composer.style.transition = 'transform .38s ease';
        composer.style.transform = 'translate(0,0)';
      });
      setTimeout(() => {
        composer.style.transition = '';
        composer.style.transform = '';
      }, 430);
    }
  }

  /* ================= 提问主流程 ================= */
  function ask(question) {
    const q = (question || input.value.trim());
    if (!q || state.busy) return;
    state.busy = true;
    askBtn.disabled = true;

    if (!state.asked) {
      state.asked = true;
      enterChatLayout();   // 首次提问：输入区移到底部，进入 chatbot 布局
      buildExpanel();      // 准备「示例」面板（首访后经「示例」按钮展开）
    }
    if (state.exOpen) toggleEx();
    input.value = '';
    autosize();

    pushQ(q, state.version);
    const loading = pushLoading();

    fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, doc_version: state.version }),
    })
      .then(r => r.json().then(d => ({ ok: r.ok, d }))
        .catch(() => ({ ok: false, d: { error: '响应不是合法 JSON' } })))
      .then(({ ok, d }) => {
        loading.timers.forEach(clearTimeout);
        loading.node.remove();
        if (!ok) { pushError(d.error || '请求失败'); return; }
        pushA(d, state.version);
      })
      .catch(err => {
        loading.timers.forEach(clearTimeout);
        loading.node.remove();
        pushError(String(err));
      })
      .finally(() => {
        state.busy = false;
        askBtn.disabled = !input.value.trim();
        input.focus();
      });
  }

  /* ================= 事件绑定 ================= */
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('.seg-btn');
    if (!b) return;
    seg.querySelectorAll('.seg-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.version = b.dataset.v;
    input.focus();
  });

  const openInfo = () => {
    const open = infoCard.classList.toggle('open');
    infoCard.setAttribute('aria-hidden', String(!open));
    infoBtn.setAttribute('aria-expanded', String(open));
  };
  infoBtn.addEventListener('click', openInfo);
  infoClose.addEventListener('click', openInfo);

  /* 事件委托：示例卡（填入并发送）、「更多示例」开合 */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('.more-toggle');
    if (t) {
      const panel = t.nextElementSibling;
      const open = panel.classList.toggle('open');
      t.classList.toggle('open', open);
      t.textContent = open ? t.dataset.openLabel : t.dataset.label;
      scrollBottom();
      return;
    }
    const card = e.target.closest('.ecard');
    if (card) {
      input.value = card.dataset.q;
      ask(card.dataset.q);
      return;
    }
  });

  exToggle.addEventListener('click', () => {
    if (!state.asked) return;  // 首访时示例已在欢迎区
    toggleEx();
  });

  function toggleEx() {
    state.exOpen = !state.exOpen;
    expanel.classList.toggle('open', state.exOpen);
    exToggle.classList.toggle('dim', state.exOpen);
    exToggle.textContent = state.exOpen ? '收起示例' : '示例';
    scrollBottom();
  }

  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }
  input.addEventListener('input', () => {
    autosize();
    askBtn.disabled = state.busy || !input.value.trim();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !askBtn.disabled) {
      e.preventDefault();
      ask();
    }
  });

  /* ================= 初始化 ================= */
  buildCards(welcome);   // 首访欢迎区示例（两张等高卡 + 「更多示例」）
  input.focus();
})();
</script>
</body>
</html>
